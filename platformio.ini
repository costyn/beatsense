; beatsense: audio analysis daughterboard (ESP32-S3 + INMP441) and its portable DSP core.
;   pio test -e native          host unit tests (Unity)
;   pio run -e stamps3        firmware

[platformio]
default_envs = stamps3
; default_envs = native

[env:stamps3]
; M5Stack StampS3 (ESP32-S3FN8, 8 MB flash, no PSRAM). Same platform as Lumifera (Arduino core 2.0.x, IDF 4.4): the legacy driver/i2s.h and Wire slave API used in src/main.cpp exist there
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
	-Iinclude
	-std=gnu++14
	-O2
	-DARDUINO_USB_CDC_ON_BOOT=1

[env:native]
platform = native
framework =
test_framework = unity
build_flags =
	-Iinclude
	-std=c++14
	-O2
	-Wall
	-Wextra
build_src_filter =
	-<*>
